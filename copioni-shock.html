// ── Render script text (bold char names, italic stage dirs) ──
function renderTesto(text) {
  return text.split('\n').map(line => {
    if (!line.trim()) return '';
    let h = line
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/\[([^\]]+)\]/g,'<span class="dir">[$1]</span>')
      .replace(/^([A-ZÀÈÉÌÒÙ][A-ZÀÈÉÌÒÙ0-9\s\-()]+):\s/,'<span class="char">$1:</span> ');
    return `<div class="script-line">${h}</div>`;
  }).filter(Boolean).join('');
}

// ── Build docs ──
function buildDocs() {

  let lastCat = null;

  COPIONI.forEach((c, idx) => {
    if (c.cat !== lastCat) {
      const sep = document.createElement('div');
      sep.className = 'cat-header';
      sep.innerHTML = `<div class="cat-line"></div><div class="cat-label">— ${c.cat === 'DIVERTENTE' ? 'Copioni Divertenti' : 'Video Informativi'} —</div><div class="cat-line"></div>`;
      panel.appendChild(sep);
      lastCat = c.cat;
    }

    const doc = document.createElement('div');
    doc.className = 'doc';
    doc.id = `doc-${idx}`;
    doc.innerHTML = `
      <div class="doc-header">
        <div>
          <div class="doc-brand-name">ASTRA AGENCY</div>
          <div class="doc-brand-sub">Social Media Agency</div>
        </div>
        <div class="doc-meta-wrap">
          <div class="doc-meta-badge">${c.cat}</div>
          <div class="doc-meta-cat">SHOCK MALE GROOMING</div>
        </div>

      <hr class="doc-sep"/>
      <div class="doc-title">🎬 ${c.titolo}</div>
      <div class="doc-info-strip">
        <div><div class="doc-info-label">Cliente</div><div class="doc-info-value">${c.cliente}</div></div>
        <div><div class="doc-info-label">N° copione</div><div class="doc-info-value">${c.n}</div></div>
        <div><div class="doc-info-label">Data</div><div class="doc-info-value">${DATA_OGG}</div></div>

// ── Scarica PDF multi-pagina ──
async function scaricaTuttiPDF() {
  const btn = document.getElementById('btn-pdf');
  btn.disabled = true;

  await document.fonts.ready;

  const { jsPDF } = window.jspdf;
  let pdf = null;

  for (let i = 0; i < COPIONI.length; i++) {
    btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="2" x2="12" y2="22"/></svg> ${i+1}/${COPIONI.length}…`;

    const el = document.getElementById(`doc-${i}`);
    const origBS = el.style.boxShadow;
    const origBR = el.style.borderRadius;
    el.style.boxShadow = 'none';
    el.style.borderRadius = '0';

    await new Promise(r => setTimeout(r, 80));

    const canvas = await html2canvas(el, {
      scale: 2, useCORS: true, allowTaint: true,
      backgroundColor: '#ffffff', logging: false
    });

    el.style.boxShadow = origBS;
    el.style.borderRadius = origBR;

    const mmW = (canvas.width  / 2) * 25.4 / 96;
    const mmH = (canvas.height / 2) * 25.4 / 96;

    if (i === 0) {
      pdf = new jsPDF({ unit:'mm', format:[mmW, mmH], orientation:'portrait' });
    } else {
      pdf.addPage([mmW, mmH], 'portrait');
    }
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.97), 'JPEG', 0, 0, mmW, mmH);
  }

  pdf.save('Copioni-Shock-AstraAgency.pdf');

  btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg> <span class="btn-label-long">Scarica tutti in PDF</span><span>PDF</span>`;
  btn.disabled = false;
}

buildDocs();
</script>

<!-- Auth Firebase -->
<script type="module">
  import { auth, db } from '/js/firebase-config.js';
  import { onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
  import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = '/admin/login.html'; return; }
    try {
      const snap = await getDoc(doc(db, 'admins', user.uid));
      if (!snap.exists()) { await signOut(auth); window.location.href = '/admin/login.html'; return; }
      const name = snap.data()?.name || user.email;
      const uel = document.getElementById('topbar-user');
      uel.textContent = name; uel.style.display = '';
      const lb = document.getElementById('btn-logout');
      lb.style.display = '';
      lb.onclick = async () => { await signOut(auth); window.location.href = '/admin/login.html'; };
    } catch(e) { window.location.href = '/admin/login.html'; }
    document.getElementById('auth-overlay').style.display = 'none';
    document.getElementById('main-layout').style.display  = '';
  });
</script>
