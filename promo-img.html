<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Promo Image – Astra Agency</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/dom-to-image-more@3.4.0/dist/dom-to-image-more.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 20px 16px 100px;
      font-family: 'Space Grotesk', sans-serif;
    }

    /* ── Wrapper per scaling mobile ── */
    .img-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      /* altezza aggiornata via JS */
    }

    /* ── Card 1200×900 (proporzione 4:3) ── */
    .img {
      width: 1200px;
      height: 900px;
      background: #07060F;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transform-origin: top center;
    }

    /* Orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }
    .orb-1 {
      width: 700px; height: 700px;
      background: radial-gradient(circle, rgba(123,92,240,.35) 0%, transparent 65%);
      bottom: -200px; left: -180px;
    }
    .orb-2 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(255,184,0,.22) 0%, transparent 65%);
      top: -120px; right: -100px;
    }
    .orb-3 {
      width: 380px; height: 380px;
      background: radial-gradient(circle, rgba(255,45,120,.14) 0%, transparent 65%);
      top: 50%; left: 60%;
      transform: translate(-50%, -50%);
    }

    .star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      pointer-events: none;
    }

    .top-accent {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, transparent, #7B5CF0, #FF2D78, #FFB800, transparent);
    }

    /* Content */
    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .logo {
      height: 100px;
      object-fit: contain;
      margin-bottom: 36px;
      filter: drop-shadow(0 0 32px rgba(123,92,240,.65));
    }

    .eyebrow {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: rgba(255,255,255,.32);
      margin-bottom: 20px;
    }

    .phrase {
      font-family: 'Syne', sans-serif;
      font-size: 88px;
      font-weight: 800;
      line-height: 1.0;
      color: #fff;
      letter-spacing: -.03em;
      margin-bottom: 28px;
    }
    .phrase .line-gold {
      background: linear-gradient(135deg, #FFD700, #FFB800, #FF8C00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .phrase .line-grad {
      background: linear-gradient(135deg, #7B5CF0, #FF2D78, #00F5FF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .sub {
      font-size: 20px;
      font-weight: 500;
      color: rgba(255,255,255,.35);
      letter-spacing: .08em;
      margin-bottom: 48px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      background: rgba(123,92,240,.14);
      border: 1.5px solid rgba(123,92,240,.45);
      border-radius: 100px;
      padding: 16px 40px;
    }
    .pill-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #7B5CF0;
      box-shadow: 0 0 12px rgba(123,92,240,.9);
      flex-shrink: 0;
    }
    .pill-text {
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: rgba(255,255,255,.75);
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .url {
      position: absolute;
      bottom: 32px;
      left: 0; right: 0;
      text-align: center;
      font-family: 'Syne', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: rgba(255,255,255,.18);
      letter-spacing: .1em;
      z-index: 2;
    }

    /* ── FAB salva ── */
    #fab {
      position: fixed;
      bottom: 24px; right: 20px;
      z-index: 999;
      width: 56px; height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7B5CF0, #FF2D78);
      border: none; cursor: pointer;
      box-shadow: 0 4px 20px rgba(123,92,240,.55);
      font-size: 24px;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: transform .15s;
    }
    #fab:active { transform: scale(.92); }

    #fab-label {
      position: fixed;
      bottom: 88px; right: 16px;
      background: rgba(20,16,40,.97);
      border: 1px solid rgba(123,92,240,.3);
      border-radius: 10px;
      padding: 8px 14px;
      color: #fff;
      font-size: 13px; font-weight: 600;
      white-space: nowrap;
      display: none;
      z-index: 999;
    }
    #fab:hover + #fab-label,
    #fab-label.show { display: block; }

    #saving-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(7,6,15,.85);
      z-index: 9999;
      align-items: center; justify-content: center;
      flex-direction: column; gap: 16px;
      color: #fff; font-size: 16px; font-weight: 600;
      font-family: 'Space Grotesk', sans-serif;
    }
    #saving-overlay.show { display: flex; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(123,92,240,.3);
      border-top-color: #7B5CF0;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Overlay immagine generata (mobile) ── */
    #img-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(7,6,15,.97);
      z-index: 10000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 16px;
    }
    #img-overlay.show { display: flex; }
    #img-overlay img {
      max-width: 100%;
      max-height: 70vh;
      border-radius: 4px;
      display: block;
    }
    #img-overlay p {
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      line-height: 1.5;
    }
    #img-overlay span { color: #00F5FF; }
    #img-overlay-close {
      padding: 12px 32px;
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 10px;
      color: #fff; font-size: 15px; font-weight: 700;
      font-family: 'Space Grotesk', sans-serif;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>

<!-- Overlay durante salvataggio -->
<div id="saving-overlay">
  <div class="spinner"></div>
  <span id="saving-msg">Generando immagine…</span>
</div>

<!-- Overlay immagine generata (mobile) -->
<div id="img-overlay">
  <img id="overlay-img" src="" alt="" />
  <p><span>Tieni premuto sull'immagine</span> → Salva su iPhone</p>
  <button id="img-overlay-close" onclick="document.getElementById('img-overlay').classList.remove('show')">✕ Chiudi</button>
</div>

<!-- FAB salva -->
<button id="fab" onclick="salva()" title="Salva immagine">💾</button>
<div id="fab-label">Salva immagine</div>

<div class="img-wrap" id="wrap">
  <div class="img" id="img">

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="top-accent"></div>

    <div class="star" style="width:3px;height:3px;top:12%;left:8%;opacity:.5;"></div>
    <div class="star" style="width:2px;height:2px;top:22%;right:12%;opacity:.4;"></div>
    <div class="star" style="width:4px;height:4px;top:68%;left:6%;opacity:.3;"></div>
    <div class="star" style="width:2px;height:2px;bottom:18%;right:9%;opacity:.45;"></div>
    <div class="star" style="width:3px;height:3px;top:45%;left:92%;opacity:.35;"></div>
    <div class="star" style="width:2px;height:2px;top:78%;left:18%;opacity:.4;"></div>

    <div class="content">
      <img src="logo.png" class="logo" alt="Astra Agency" />
      <div class="eyebrow">Social Media Agency · astragency.it</div>
      <div class="phrase">
        Il tuo brand<br/>
        <span class="line-grad">visibile.</span><br/>
        <span class="line-gold">Adesso.</span>
      </div>
      <div class="sub">Chiamata gratuita &nbsp;·&nbsp; Senza impegno</div>
      <div class="pill">
        <div class="pill-dot"></div>
        <span class="pill-text">Prenota su astragency.it</span>
      </div>
    </div>

    <div class="url">astragency.it &nbsp;·&nbsp; info@astragency.it</div>

  </div>
</div>

<script>
  // ── Scala la card per adattarsi allo schermo ──
  function scale() {
    const card = document.getElementById('img');
    const wrap = document.getElementById('wrap');
    const maxW = window.innerWidth - 32;
    const s = Math.min(maxW / 1200, 1);
    card.style.transform = `scale(${s})`;
    wrap.style.height = Math.round(900 * s) + 'px';
  }
  scale();
  window.addEventListener('resize', scale);

  // ── Salva immagine ──
  async function salva() {
    const overlay = document.getElementById('saving-overlay');
    const msg = document.getElementById('saving-msg');
    const card = document.getElementById('img');

    // Ripristina scala 1:1 durante il render
    card.style.transform = 'scale(1)';

    overlay.classList.add('show');
    msg.textContent = 'Generando immagine…';

    try {
      const scale = 2; // 2x per qualità alta
      const dataUrl = await domtoimage.toPng(card, {
        width:  1200 * scale,
        height: 900  * scale,
        style: {
          transform: `scale(${scale})`,
          transformOrigin: 'top left',
        }
      });

      msg.textContent = 'Apertura…';

      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (isMobile) {
        // Su mobile: mostra immagine nella pagina, tieni premuto per salvare
        document.getElementById('overlay-img').src = dataUrl;
        document.getElementById('img-overlay').classList.add('show');
      } else {
        const a = document.createElement('a');
        a.download = 'Astra-PromoGoogle.png';
        a.href = dataUrl;
        a.click();
      }
    } catch(e) {
      alert('Errore: ' + e.message);
    }

    overlay.classList.remove('show');
    scale(); // ripristina scaling
  }
</script>

</body>
</html>
