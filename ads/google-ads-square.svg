<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Syne:wght@800&amp;family=Space+Grotesk:wght@400;500;600&amp;display=swap');
    </style>
    <radialGradient id="g1" cx="25%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#7B5CF0" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#07060F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="78%" cy="82%" r="50%">
      <stop offset="0%" stop-color="#FF2D78" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#07060F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="82%" cy="18%" r="38%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#07060F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B5CF0"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="onlineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B5CF0"/>
      <stop offset="100%" stop-color="#FF2D78"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1200" fill="#07060F"/>
  <rect width="1200" height="1200" fill="url(#g1)"/>
  <rect width="1200" height="1200" fill="url(#g2)"/>
  <rect width="1200" height="1200" fill="url(#g3)"/>

  <!-- Decorative rings -->
  <circle cx="140" cy="140" r="200" fill="none" stroke="#7B5CF0" stroke-width="1" opacity="0.14"/>
  <circle cx="140" cy="140" r="340" fill="none" stroke="#7B5CF0" stroke-width="0.5" opacity="0.07"/>
  <circle cx="1060" cy="1060" r="260" fill="none" stroke="#FF2D78" stroke-width="1" opacity="0.13"/>
  <circle cx="1060" cy="1060" r="400" fill="none" stroke="#FF2D78" stroke-width="0.5" opacity="0.06"/>

  <!-- Decorative dots top-right -->
  <circle cx="980" cy="80"  r="3" fill="#7B5CF0" opacity="0.4"/>
  <circle cx="1020" cy="80" r="3" fill="#7B5CF0" opacity="0.4"/>
  <circle cx="1060" cy="80" r="3" fill="#7B5CF0" opacity="0.4"/>
  <circle cx="980" cy="120" r="3" fill="#7B5CF0" opacity="0.25"/>
  <circle cx="1020" cy="120" r="3" fill="#7B5CF0" opacity="0.25"/>
  <circle cx="1060" cy="120" r="3" fill="#7B5CF0" opacity="0.25"/>
  <circle cx="980" cy="160" r="3" fill="#7B5CF0" opacity="0.12"/>
  <circle cx="1020" cy="160" r="3" fill="#7B5CF0" opacity="0.12"/>
  <circle cx="1060" cy="160" r="3" fill="#7B5CF0" opacity="0.12"/>

  <!-- 4-pointed star centered at 600,245 R=50 r=19 -->
  <path d="M 600,195 L 613,232 L 650,245 L 613,258 L 600,295 L 587,258 L 550,245 L 587,232 Z"
        fill="#7B5CF0" filter="url(#glow)"/>

  <!-- ASTRA -->
  <text x="600" y="358"
        text-anchor="middle"
        font-family="Syne, 'Arial Black', sans-serif"
        font-weight="800"
        font-size="104"
        fill="white"
        letter-spacing="10">ASTRA</text>

  <!-- AGENCY -->
  <text x="600" y="408"
        text-anchor="middle"
        font-family="'Space Grotesk', Arial, sans-serif"
        font-weight="600"
        font-size="26"
        fill="#7B5CF0"
        letter-spacing="16">AGENCY</text>

  <!-- Separator -->
  <line x1="430" y1="455" x2="770" y2="455" stroke="#7B5CF0" stroke-width="1" opacity="0.35"/>

  <!-- Headline -->
  <text x="600" y="565"
        text-anchor="middle"
        font-family="Syne, 'Arial Black', sans-serif"
        font-weight="800"
        font-size="74"
        fill="white">Fai crescere la</text>

  <text x="600" y="655"
        text-anchor="middle"
        font-family="Syne, 'Arial Black', sans-serif"
        font-weight="800"
        font-size="74"
        fill="white">tua attività</text>

  <text x="600" y="745"
        text-anchor="middle"
        font-family="Syne, 'Arial Black', sans-serif"
        font-weight="800"
        font-size="74"
        fill="url(#onlineGrad)">online.</text>

  <!-- Services -->
  <text x="600" y="840"
        text-anchor="middle"
        font-family="'Space Grotesk', Arial, sans-serif"
        font-weight="500"
        font-size="32"
        fill="rgba(255,255,255,0.55)"
        letter-spacing="1">Social Media  ·  Siti Web  ·  Grafica</text>

  <!-- CTA Button -->
  <rect x="375" y="910" width="450" height="78" rx="39" fill="url(#btnGrad)"/>
  <text x="600" y="957"
        text-anchor="middle"
        font-family="'Space Grotesk', Arial, sans-serif"
        font-weight="700"
        font-size="30"
        fill="white">Scopri i pacchetti →</text>

  <!-- Website URL -->
  <text x="600" y="1090"
        text-anchor="middle"
        font-family="'Space Grotesk', Arial, sans-serif"
        font-size="24"
        fill="rgba(255,255,255,0.28)"
        letter-spacing="2">astragency.it</text>
</svg>
