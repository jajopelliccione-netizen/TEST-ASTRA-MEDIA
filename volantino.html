<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volantino – Astra Agency</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #07060F;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 40px 20px;
      font-family: 'Space Grotesk', sans-serif;
    }

    .flyer {
      width: 700px;
      min-height: 990px;
      background: #07060F;
      border-radius: 28px;
      border: 1px solid rgba(123,92,240,0.25);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 64px 56px 52px;
      gap: 0;
    }

    /* Ambient orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
    }
    .orb-1 {
      width: 420px; height: 420px;
      background: rgba(123,92,240,0.28);
      bottom: -120px; left: -140px;
    }
    .orb-2 {
      width: 300px; height: 300px;
      background: rgba(255,45,120,0.18);
      top: -80px; right: -100px;
    }
    .orb-3 {
      width: 200px; height: 200px;
      background: rgba(0,245,255,0.08);
      top: 40%; left: 50%;
      transform: translateX(-50%);
    }

    /* Particles */
    .dot {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.35);
    }

    /* Logo */
    .logo {
      height: 60px;
      object-fit: contain;
      margin-bottom: 32px;
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 0 18px rgba(123,92,240,0.5));
    }

    /* Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(0,245,255,0.45);
      border-radius: 100px;
      padding: 9px 24px;
      margin-bottom: 28px;
      position: relative;
      z-index: 2;
      background: rgba(0,245,255,0.05);
      box-shadow: 0 0 20px rgba(0,245,255,0.12), inset 0 0 20px rgba(0,245,255,0.04);
    }
    .badge-dot {
      width: 10px; height: 10px;
      background: #00F5FF;
      border-radius: 50%;
      box-shadow: 0 0 10px #00F5FF, 0 0 20px rgba(0,245,255,0.6);
      flex-shrink: 0;
    }
    .badge-text {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.2em;
      color: #00F5FF;
      text-transform: uppercase;
    }

    /* Headline */
    .headline {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 56px;
      line-height: 1.08;
      letter-spacing: -0.02em;
      color: #ffffff;
      text-align: center;
      margin-bottom: 20px;
      position: relative;
      z-index: 2;
      text-shadow: 0 2px 40px rgba(123,92,240,0.25);
    }
    .gradient-word {
      background: linear-gradient(135deg, #7B5CF0, #FF2D78, #00F5FF);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Subline */
    .subline {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 500;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.15em;
      text-align: center;
      margin-bottom: 48px;
      position: relative;
      z-index: 2;
    }

    /* Divider */
    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(123,92,240,0.3), rgba(0,245,255,0.2), transparent);
      margin-bottom: 44px;
      position: relative;
      z-index: 2;
    }

    /* Services */
    .services {
      display: flex;
      gap: 16px;
      width: 100%;
      margin-bottom: 44px;
      position: relative;
      z-index: 2;
    }
    .service-card {
      flex: 1;
      background: rgba(123,92,240,0.07);
      border: 1px solid rgba(123,92,240,0.22);
      border-radius: 16px;
      padding: 22px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
      transition: border-color 0.2s;
    }
    .service-icon-wrap {
      width: 46px; height: 46px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .service-icon-wrap svg { width: 24px; height: 24px; }
    .service-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
      line-height: 1.4;
    }

    /* CTA Button */
    .cta-wrap {
      position: relative;
      z-index: 2;
      margin-bottom: 44px;
    }
    .cta-btn {
      display: inline-block;
      background: linear-gradient(135deg, #7B5CF0, #FF2D78);
      border-radius: 100px;
      padding: 16px 44px;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 16px;
      color: #ffffff;
      text-decoration: none;
      letter-spacing: 0.02em;
      box-shadow: 0 0 30px rgba(123,92,240,0.45), 0 0 60px rgba(255,45,120,0.2);
    }

    /* Contacts */
    .contacts {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 20px;
      margin-bottom: 36px;
      position: relative;
      z-index: 2;
    }
    .contact-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12.5px;
      color: rgba(255,255,255,0.45);
      font-family: 'Space Grotesk', sans-serif;
    }
    .contact-chip svg { width: 13px; height: 13px; flex-shrink: 0; }

    /* Social row */
    .social-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      position: relative;
      z-index: 2;
    }
    .social-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 10px;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 700;
      font-family: 'Space Grotesk', sans-serif;
      color: #fff;
      text-decoration: none;
    }
    .social-btn.ig {
      background: linear-gradient(135deg, #f58529, #dd2a7b, #8134af);
    }
    .social-btn.tt {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border: 1px solid rgba(0,245,255,0.3);
      box-shadow: 0 0 12px rgba(0,245,255,0.15);
    }
    .social-btn svg { width: 15px; height: 15px; }

    /* Footer line */
    .footer-line {
      margin-top: 32px;
      font-size: 11px;
      color: rgba(255,255,255,0.18);
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: 0.05em;
      text-align: center;
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>

<div class="flyer">

  <!-- Ambient orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- Decorative dots -->

  <p class="subline">Strategia &nbsp;·&nbsp; Contenuti &nbsp;·&nbsp; Crescita</p>

      <span class="service-name">Gestione<br/>Social Media</span>

    <div class="service-card">

          <rect x="2" y="5" width="20" height="15" rx="2" stroke="#FF2D78" stroke-width="2"/>
          <path d="M10 9l6 3-6 3V9z" fill="#FF2D78"/>

      <span class="service-name">Foto<br/>& Video</span>
    </div>

    <div class="service-card">
      <div class="service-icon-wrap" style="background:linear-gradient(135deg,rgba(0,245,255,0.15),rgba(0,153,204,0.12));">
        <svg viewBox="0 0 24 24" fill="none">
          <polyline points="22,7 13.5,15.5 8.5,10.5 2,17" stroke="#00F5FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points="16,7 22,7 22,13" stroke="#00F5FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="service-name">Strategia<br/>di Crescita</span>
    </div>

  </div>

  <!-- CTA -->
  <div class="cta-wrap">
    <span class="cta-btn">Prenota una consulenza gratuita ✦</span>
  </div>

  <!-- Contacts -->
  <div class="contacts">
    <span class="contact-chip">

  </div>

  <!-- Footer -->
  <p class="footer-line">© 2025 Astra Agency · Tutti i diritti riservati</p>

</div>

</body>
</html>
