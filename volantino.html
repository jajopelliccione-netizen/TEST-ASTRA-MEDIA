<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volantino – Astra Agency</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #030208;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      min-height: 100vh;
      padding: 32px 20px 60px;
      font-family: 'Space Grotesk', sans-serif;
    }

    /* ── Export bar ── */
    .export-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .export-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 22px;
      border-radius: 10px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: opacity .2s, transform .15s;
    }
    .export-btn:hover { opacity: .85; transform: translateY(-1px); }
    .export-btn:active { transform: translateY(0); }
    .btn-pptx {
      background: linear-gradient(135deg, #7B5CF0, #FF2D78);
      color: #fff;
      box-shadow: 0 0 20px rgba(123,92,240,0.4);
    }
    .btn-png {
      background: rgba(255,255,255,0.07);
      color: rgba(255,255,255,0.75);
      border: 1px solid rgba(255,255,255,0.12);
    }

    /* ── Flyer card ── */
    .flyer {
      width: 700px;
      min-height: 990px;
      background: #07060F;
      border-radius: 28px;
      border: 1px solid rgba(123,92,240,0.25);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 64px 56px 52px;
    }

    /* Ambient orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
    }
    .orb-1 { width:460px;height:460px;background:rgba(123,92,240,0.3);bottom:-140px;left:-160px; }
    .orb-2 { width:320px;height:320px;background:rgba(255,45,120,0.18);top:-90px;right:-110px; }
    .orb-3 { width:220px;height:220px;background:rgba(0,245,255,0.07);top:42%;left:50%;transform:translateX(-50%); }

    .dot {
      position:absolute;border-radius:50%;
      background:rgba(255,255,255,0.4);
      pointer-events:none;
    }

    /* ── Logo ── */
    .logo {
      height: 58px;
      object-fit: contain;
      margin-bottom: 30px;
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 0 22px rgba(123,92,240,0.55));
    }

    /* ── Badge — identico allo screenshot ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(135deg, rgba(0,38,58,0.95), rgba(4,18,44,0.92));
      border: 1.5px solid rgba(0,245,255,0.6);
      border-radius: 100px;
      padding: 12px 32px;
      margin-bottom: 30px;
      position: relative;
      z-index: 2;
      box-shadow:
        0 0 18px rgba(0,245,255,0.22),
        0 0 40px rgba(0,245,255,0.09),
        inset 0 0 22px rgba(0,245,255,0.06),
        inset 0 1px 0 rgba(0,245,255,0.18);
    }
    .badge-dot {
      width: 12px; height: 12px;
      background: #00F5FF;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 8px #00F5FF, 0 0 18px rgba(0,245,255,0.7), 0 0 32px rgba(0,245,255,0.35);
    }
    .badge-text {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 13.5px;
      letter-spacing: 0.22em;
      color: #00F5FF;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(0,245,255,0.55);
    }

    /* ── Headline ── */
    .headline {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 58px;
      line-height: 1.08;
      letter-spacing: -0.02em;
      color: #ffffff;
      text-align: center;
      margin-bottom: 20px;
      position: relative;
      z-index: 2;
      text-shadow: 0 2px 40px rgba(123,92,240,0.22);
    }
    .gradient-word {
      background: linear-gradient(135deg, #7B5CF0 0%, #FF2D78 55%, #00F5FF 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Subline ── */
    .subline {
      font-size: 15px;
      font-weight: 500;
      color: rgba(255,255,255,0.42);
      letter-spacing: 0.16em;
      text-align: center;
      margin-bottom: 46px;
      position: relative;
      z-index: 2;
    }

    /* ── Divider ── */
    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg,transparent,rgba(123,92,240,0.35),rgba(0,245,255,0.2),transparent);
      margin-bottom: 42px;
      position: relative;
      z-index: 2;
    }

    /* ── Services ── */
    .services {
      display: flex;
      gap: 14px;
      width: 100%;
      margin-bottom: 42px;
      position: relative;
      z-index: 2;
    }
    .service-card {
      flex: 1;
      background: rgba(123,92,240,0.07);
      border: 1px solid rgba(123,92,240,0.22);
      border-radius: 16px;
      padding: 22px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 11px;
      text-align: center;
    }
    .service-icon-wrap {
      width: 46px; height: 46px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .service-icon-wrap svg { width: 24px; height: 24px; }
    .service-name {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
      line-height: 1.4;
    }

    /* ── CTA ── */
    .cta-wrap {
      position: relative;
      z-index: 2;
      margin-bottom: 42px;
    }
    .cta-btn {
      display: inline-block;
      background: linear-gradient(135deg, #7B5CF0, #FF2D78);
      border-radius: 100px;
      padding: 16px 48px;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 16px;
      color: #ffffff;
      letter-spacing: 0.02em;
      box-shadow: 0 0 32px rgba(123,92,240,0.5), 0 0 64px rgba(255,45,120,0.2);
    }

    /* ── Contacts ── */
    .contacts {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 22px;
      margin-bottom: 32px;
      position: relative;
      z-index: 2;
    }
    .contact-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12.5px;
      color: rgba(255,255,255,0.42);
    }
    .contact-chip svg { width: 13px; height: 13px; flex-shrink: 0; }

    /* ── Social ── */
    .social-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      position: relative;
      z-index: 2;
    }
    .social-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 10px;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
    }
    .social-btn.ig { background: linear-gradient(135deg,#f58529,#dd2a7b,#8134af); }
    .social-btn.tt {
      background: linear-gradient(135deg,#1a1a2e,#16213e);

      box-shadow: 0 0 14px rgba(0,245,255,0.12);
    }
    .social-btn svg { width: 15px; height: 15px; }

    /* ── Footer ── */
    .footer-line {
      margin-top: 30px;
      font-size: 11px;
      color: rgba(255,255,255,0.18);
      letter-spacing: 0.05em;
      text-align: center;
      position: relative;
      z-index: 2;
    }
  </style>
</head>

<script>
async function exportPPTX() {
  const btn = document.querySelector('.btn-pptx');
  btn.textContent = 'Generando...';
  btn.style.opacity = '.6';

  try {
    const pptx = new PptxGenJS();
    pptx.layout = 'LAYOUT_4x3';
    pptx.defineLayout({ name: 'A4_V', width: 7.48, height: 10.58 });
    pptx.layout = 'A4_V';

    const slide = pptx.addSlide();
    slide.background = { color: '07060F' };

    // Orb viola (basso-sinistra)
    slide.addShape(pptx.ShapeType.ellipse, {
      x: -1.4, y: 7.5, w: 4.5, h: 4.5,
      fill: { color: '7B5CF0', transparency: 72 },
      line: { color: '7B5CF0', transparency: 100 }
    });

    // Orb rosa (alto-destra)
    slide.addShape(pptx.ShapeType.ellipse, {
      x: 5.5, y: -0.8, w: 3.2, h: 3.2,
      fill: { color: 'FF2D78', transparency: 82 },
      line: { color: 'FF2D78', transparency: 100 }
    });

    // ── Logo (testo fallback se immagine non disponibile) ──
    try {
      const img = document.querySelector('.logo');
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      const dataUrl = canvas.toDataURL('image/png');
      const logoH = 0.55;
      const logoW = logoH * (img.naturalWidth / img.naturalHeight);
      slide.addImage({
        data: dataUrl,
        x: (7.48 - logoW) / 2,
        y: 0.5,
        w: logoW,
        h: logoH
      });
    } catch(e) {
      slide.addText('ASTRA AGENCY', {
        x: 0, y: 0.45, w: 7.48, h: 0.6,
        align: 'center',
        fontFace: 'Syne',
        fontSize: 22,
        bold: true,
        color: 'FFFFFF'
      });
    }

    // ── Badge background ──
    slide.addShape(pptx.ShapeType.roundRect, {
      x: 1.4, y: 1.35, w: 4.68, h: 0.48,
      rectRadius: 0.24,
      fill: { color: '00263A', transparency: 8 },
      line: { color: '00F5FF', width: 1.5, transparency: 40 }
    });

    // Badge dot
    slide.addShape(pptx.ShapeType.ellipse, {
      x: 1.82, y: 1.52, w: 0.14, h: 0.14,
      fill: { color: '00F5FF' },
      line: { color: '00F5FF', transparency: 100 }
    });

    // Badge text
    slide.addText('SOCIAL MEDIA AGENCY', {
      x: 2.06, y: 1.37, w: 3.7, h: 0.46,
      align: 'left',
      valign: 'middle',
      fontFace: 'Syne',
      fontSize: 9,
      bold: true,
      color: '00F5FF',
      charSpacing: 4
    });

    // ── Headline ──
    slide.addText([
      { text: 'Portiamo il tuo\n', options: { color: 'FFFFFF' } },
      { text: 'brand', options: { color: '9B6FF5' } },
      { text: ' tra le stelle', options: { color: 'FFFFFF' } }
    ], {
      x: 0.3, y: 1.98, w: 6.88, h: 2.2,
      align: 'center',
      fontFace: 'Syne',
      fontSize: 40,
      bold: true,
      lineSpacingMultiple: 1.1
    });

    // ── Subline ──
    slide.addText('Strategia  ·  Contenuti  ·  Crescita', {
      x: 0.5, y: 4.22, w: 6.48, h: 0.4,
      align: 'center',
      fontFace: 'Space Grotesk',
      fontSize: 11,
      bold: false,
      color: '666688',
      charSpacing: 2.5
    });

    // ── Divider line ──
    slide.addShape(pptx.ShapeType.line, {
      x: 0.5, y: 4.82, w: 6.48, h: 0,
      line: { color: '7B5CF0', width: 0.5, transparency: 60 }
    });

    // ── Service cards ──
    const services = [
      { title: 'Gestione\nSocial Media', color: '7B5CF0' },
      { title: 'Foto\n& Video',          color: 'FF2D78' },
      { title: 'Strategia\ndi Crescita', color: '00F5FF' }
    ];
    services.forEach((s, i) => {
      const x = 0.3 + i * 2.3;
      slide.addShape(pptx.ShapeType.roundRect, {
        x, y: 5.02, w: 2.12, h: 1.52,
        rectRadius: 0.14,
        fill: { color: '7B5CF0', transparency: 93 },
        line: { color: '7B5CF0', width: 0.75, transparency: 78 }
      });
      slide.addText(s.title, {
        x, y: 5.5, w: 2.12, h: 0.8,
        align: 'center',
        fontFace: 'Space Grotesk',
        fontSize: 10.5,
        bold: true,
        color: 'DDDDEE'
      });
    });

    // ── CTA button ──
    slide.addShape(pptx.ShapeType.roundRect, {
      x: 1.24, y: 6.82, w: 5.0, h: 0.55,
      rectRadius: 0.28,
      fill: { color: 'A040C0', transparency: 0 },
      line: { color: 'FF2D78', transparency: 100 }
    });
    slide.addText('Prenota una consulenza gratuita ✦', {
      x: 1.24, y: 6.82, w: 5.0, h: 0.55,
      align: 'center',
      valign: 'middle',
      fontFace: 'Syne',
      fontSize: 12,
      bold: true,
      color: 'FFFFFF'
    });

    // ── Contacts ──
    slide.addText('info@astragency.it   ·   astragency.it', {
      x: 0.5, y: 7.6, w: 6.48, h: 0.35,
      align: 'center',
      fontFace: 'Space Grotesk',
      fontSize: 9.5,
      color: '666680',
      charSpacing: 0.5
    });

    // ── Social buttons ──
    // Instagram
