name: Deploy ASTRA Media to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepara file statici (escludi cartelle server-side)
        run: |
          mkdir -p _deploy
          rsync -a \
            --exclude='functions/' \
            --exclude='firebase-functions/' \
            --exclude='.github/' \
            --exclude='_deploy/' \
            --exclude='.git/' \
            . _deploy/

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_deploy'

      - id: deployment
        uses: actions/deploy-pages@v4
