<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="192x192" href="/admin/icon.png" />
  <link rel="apple-touch-icon" href="/admin/icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin – Astra Agency</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/portal.css?v=4" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <div class="login-logo">
        <img src="../logo.png" alt="Astra Agency" />
        <span>Astra Agency</span>
      </div>
      <span class="badge badge-pink" style="display:block;text-align:center;margin-bottom:24px;">Pannello Admin</span>
      <h1 class="login-title">Accesso Admin</h1>
      <p class="login-sub">Accesso riservato al team Astra Agency.</p>

      <div class="login-error" id="login-error"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Username o Email</label>
          <input class="form-input" type="text" id="email" placeholder="es. admin" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="pwd-wrap">
            <input class="form-input" type="password" id="password" placeholder="••••••••" required />
            <button type="button" class="pwd-eye" onclick="togglePwd('password',this)" tabindex="-1"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;" id="submit-btn">
          Accedi
        </button>
      </form>
    </div>
  </div>

  <script type="module">
    import { auth, db } from '../js/firebase-config.js';
    import { signInWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    onAuthStateChanged(auth, async (user) => {
      if (!user) return;
      const snap = await getDoc(doc(db, 'admins', user.uid));
      if (snap.exists()) window.location.href = '/admin/dashboard.html';
    });

    const errEl = document.getElementById('login-error');
    const btn   = document.getElementById('submit-btn');

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.classList.remove('show');
      btn.textContent = 'Accesso in corso…';
      btn.disabled = true;

      try {
        let input = document.getElementById('email').value.trim();

        // Se non è una email, cerca l'alias username → email
        if (!input.includes('@')) {
          const aliasSnap = await getDoc(doc(db, 'auth_aliases', input.toLowerCase()));
          if (!aliasSnap.exists()) {
            errEl.textContent = 'Username non trovato.';
            errEl.classList.add('show');
            btn.textContent = 'Accedi'; btn.disabled = false;
            return;
          }
          input = aliasSnap.data().email;
        }

        const cred = await signInWithEmailAndPassword(auth, input, document.getElementById('password').value);
        const snap = await getDoc(doc(db, 'admins', cred.user.uid));
        if (!snap.exists()) {
          errEl.textContent = 'Accesso negato. Non sei un amministratore.';
          errEl.classList.add('show');
          await auth.signOut();
        }
      } catch (err) {
        const msgs = {
          'auth/invalid-credential': 'Credenziali errate.',
          'auth/too-many-requests':  'Troppi tentativi. Attendi qualche minuto.',
        };
        errEl.textContent = msgs[err.code] || 'Errore di accesso.';
        errEl.classList.add('show');
      }
      btn.textContent = 'Accedi';
      btn.disabled = false;
    });
  </script>
  <script>
    function togglePwd(id, btn) {
      const inp = document.getElementById(id);
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      btn.innerHTML = show
        ? '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="1" y1="1" x2="23" y2="23"/><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/></svg>'
        : '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    }
  </script>
</body>
</html>
